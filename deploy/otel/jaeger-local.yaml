# Local-only OpenTelemetry Collector config: OTLP in, Jaeger all-in-one out.
# Traces only. No cloud exporter, no metrics pipeline, no retention policy.
# Not a production trace pipeline (Jaeger all-in-one keeps spans in memory).
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
processors:
  batch: {}
exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/jaeger]
