[project]
name = "atlas-ai"
version = "0.1.0"
description = "Human-controlled, modular AI work platform"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic>=2.8,<3", "httpx>=0.27,<1", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "celery[redis]>=5.4,<6", "redis>=5,<6", "pgvector>=0.3,<1", "spacy>=3.8,<4", "dateparser>=1.2,<2", "transformers>=4.45,<5", "torch>=2.4,<3", "beautifulsoup4>=4.12,<5", "instaloader>=4.13,<5", "python-docx>=1.1,<2", "weasyprint>=62,<70"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "celery[redis]>=5.4,<6", "redis>=5,<6", "pgvector>=0.3,<1", "spacy>=3.8,<4", "dateparser>=1.2,<2", "transformers>=4.45,<5", "torch>=2.4,<3", "beautifulsoup4>=4.12,<5", "instaloader>=4.13,<5", "python-docx>=1.1,<2", "weasyprint>=62,<70"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]
