[project]
name = "atlas-ai"
version = "0.1.0"
description = "Human-controlled, modular AI work platform"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic>=2.8,<3", "httpx>=0.27,<1", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]
