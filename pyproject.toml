[project]
name = "atlas-ai"
version = "0.1.0"
description = "Human-controlled, modular AI work platform"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2", "cvxpy>=1.6,<2", "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic>=2.8,<3", "httpx>=0.27,<1", "sqlalchemy>=2.0,<3", "alembic>=1.13,<2", "psycopg[binary]>=3.2,<4", "celery[redis]>=5.4,<6", "redis>=5,<6", "pgvector>=0.3,<1", "spacy>=3.8,<4", "dateparser>=1.2,<2", "regex>=2024.11,<2028", "fastembed>=0.4,<1", "transformers>=4.45,<5", "torch>=2.4,<3", "beautifulsoup4>=4.12,<5", "instaloader>=4.13,<5", "python-docx>=1.1,<2", "weasyprint>=62,<70", "python-pptx>=1.0,<2", "jinja2>=3.1,<4", "GitPython>=3.1,<4", "docxtpl>=0.19,<1", "plotly>=5,<7", "matplotlib>=3.9,<4", "PyYAML>=6,<7", "playwright>=1.48,<2", "cryptography>=43,<47", "chromadb>=0.6,<2", "langchain-core>=0.3,<2", "selenium>=4.25,<5", "PyMuPDF>=1.24,<2", "pytesseract>=0.3,<1", "unstructured>=0.16,<1", "APScheduler>=3.10,<4", "opentelemetry-api>=1.27,<2", "opentelemetry-sdk>=1.27,<2", "opentelemetry-exporter-otlp>=1.27,<2", "google-cloud-storage>=2.18,<4", "hvac>=2.3,<3"]

[project.optional-dependencies]
dev = ["pytest-asyncio>=0.24,<2", "fastembed>=0.4,<1", "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl", "pytest>=8,<9", "httpx>=0.27,<1", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "celery[redis]>=5.4,<6", "redis>=5,<6", "pgvector>=0.3,<1", "spacy>=3.8,<4", "dateparser>=1.2,<2", "regex>=2024.11,<2028", "transformers>=4.45,<5", "torch>=2.4,<3", "beautifulsoup4>=4.12,<5", "instaloader>=4.13,<5", "python-docx>=1.1,<2", "weasyprint>=62,<70", "python-pptx>=1.0,<2", "jinja2>=3.1,<4", "GitPython>=3.1,<4", "docxtpl>=0.19,<1", "plotly>=5,<7", "matplotlib>=3.9,<4", "PyYAML>=6,<7", "playwright>=1.48,<2", "cryptography>=43,<47", "asn1crypto>=1.5,<2", "pgserver>=0.1.4,<0.2; python_version < '3.13' and ((sys_platform == 'linux' and platform_machine == 'x86_64') or sys_platform == 'darwin' or (sys_platform == 'win32' and platform_machine == 'AMD64'))"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*", "instinct_models*"]
