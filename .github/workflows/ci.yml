name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ATLAS_DATABASE_URL: postgresql+psycopg://atlas:atlas@localhost:5432/atlas_test
      ATLAS_REDIS_URL: redis://localhost:6379/0
      PYTHONUNBUFFERED: "1"
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "psql -U atlas -d atlas_test -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS vector' >/dev/null && psql -U atlas -d atlas_test -tAc 'SELECT 1 FROM pg_extension WHERE extname=$$vector$$' | grep -qx 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install backend and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Initialize and verify pgvector
        env:
          PGPASSWORD: atlas
        run: |
          psql -h localhost -p 5432 -U atlas -d atlas_test \
            -v ON_ERROR_STOP=1 \
            -c 'CREATE EXTENSION IF NOT EXISTS vector;'
          test "$(psql -h localhost -p 5432 -U atlas -d atlas_test -tAc "SELECT 1 FROM pg_extension WHERE extname='vector'")" = "1"
      - name: Compile all Python sources
        run: python -m compileall -q backend tests *.py
      - name: Smoke-test application imports from repository root
        run: |
          python - <<'PY'
          import secrets
          from app.main import app

          assert callable(secrets.token_hex)
          assert len(secrets.token_hex(8)) == 16
          assert app is not None
          PY
      - name: Run the complete backend test suite
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t atlas-api:test .
      - run: docker build -t atlas-web:test frontend
